<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio 1 — Dashboard</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --brand:      #56a2bf;
    --brand-dark: #4490ad;
    --brand-50:   #ecf5f8;

    --bg:       #f6f7f9;
    --surface:  #ffffff;
    --surface-2:#f7f8fa;
    --border:   #e6e8ec;
    --border-2: #eef0f3;
    --ink:      #14181c;
    --ink-2:    #3a4047;
    --muted:    #6b7280;
    --muted-2:  #9aa1ab;

    --green: #16a34a;
    --amber: #d97706;
    --red:   #dc2626;
    --blue:  #2f6fc7;

    --radius:    12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }

  /* ── Top bar ─────────────────────────────────────────── */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 11px 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: #fff; border: 1px solid var(--border);
    display: grid; place-items: center; padding: 4px;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .brand-title { font-weight: 600; font-size: 14px; line-height: 1.1; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .top-actions { display: flex; align-items: center; gap: 8px; }

  .runcount {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--ink-2);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 6px 11px; border-radius: var(--radius-sm);
    white-space: nowrap;
  }
  .runcount .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-2); }
  .runcount.live .dot { background: var(--green); }
  .runcount b { font-weight: 600; }

  .search { position: relative; }
  .search input {
    width: 220px; padding: 7px 12px 7px 32px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-family: inherit; font-size: 13px;
    color: var(--ink); outline: none;
    transition: border-color .12s ease, background .12s ease;
  }
  .search input::placeholder { color: var(--muted-2); }
  .search input:focus { border-color: var(--brand); background: #fff; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted-2); }

  .btn {
    font-family: inherit; font-size: 13px; font-weight: 500; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: var(--radius-sm); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink-2); }
  .btn-danger { color: var(--red); }
  .btn-danger:hover { background: #fdecec; }

  /* ── Page ────────────────────────────────────────────── */
  main { max-width: 1080px; margin: 0 auto; padding: 22px 22px 56px; }

  .group { margin-bottom: 22px; }
  .group.hidden { display: none; }
  .group-head { display: flex; align-items: center; gap: 9px; margin: 0 2px 9px; }
  .group-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--muted); font-weight: 600; white-space: nowrap;
  }
  .group-count {
    font-size: 10.5px; color: var(--muted-2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px;
  }
  .group-rule { flex: 1; height: 1px; background: var(--border); }

  /* ── List ────────────────────────────────────────────── */
  .list {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .row {
    display: flex; align-items: center; gap: 11px;
    height: 46px; padding: 0 14px;
    border-bottom: 1px solid var(--border-2);
    transition: background .1s ease;
  }
  .row:hover { background: var(--surface-2); }
  .row:nth-child(odd) { border-right: 1px solid var(--border-2); }
  .row.filler { pointer-events: none; }
  .row.filler:hover { background: transparent; }

  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--muted-2); }
  .dot.run     { background: var(--green); }
  .dot.starting{ background: var(--amber); }
  .dot.error   { background: var(--red); }
  .dot.ready   { background: var(--brand); }
  .dot.desktop { background: var(--blue); }

  .rname { flex: 1; min-width: 0; font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .rname.on { font-weight: 600; }
  .rmeta { font-size: 11px; color: var(--muted-2); white-space: nowrap; }

  .ract { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .mini {
    font-family: inherit; font-size: 11.5px; font-weight: 500;
    padding: 4px 11px; border-radius: 7px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    transition: background .1s ease, border-color .1s ease, color .1s ease;
  }
  .mini:hover { background: var(--surface-2); border-color: #d6d9df; }
  .mini.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .mini.primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
  .mini.retry { color: var(--red); border-color: #f3cdcd; background: #fdf1f1; }
  .mini.retry:hover { background: #fbe4e4; }
  .mini.muted { color: var(--muted); background: transparent; border-color: transparent; cursor: default; }
  .mini.stop { color: var(--muted); padding: 4px 9px; }
  .mini.stop:hover { color: var(--red); border-color: #f3cdcd; background: #fdf1f1; }

  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 44px 0; }

  .hint {
    margin-top: 8px; color: var(--muted-2); font-size: 12px;
    display: flex; align-items: center; gap: 8px; padding: 0 2px;
  }
  .hint .kbd {
    background: var(--surface); border: 1px solid var(--border); border-bottom-width: 2px;
    padding: 0 5px; border-radius: 5px; font-size: 10.5px; color: var(--ink-2);
  }
  .hint code { background: var(--surface); border: 1px solid var(--border-2); padding: 1px 5px; border-radius: 5px; font-size: 11px; color: var(--ink-2); }

  @media (max-width: 760px) {
    .list { grid-template-columns: 1fr; }
    .row:nth-child(odd) { border-right: none; }
    .search input { width: 150px; }
    .brand-sub { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo"><img src="/logo.svg" alt="Studio 1" /></div>
    <div>
      <div class="brand-title">Studio 1</div>
      <div class="brand-sub">Dashboard</div>
    </div>
  </div>
  <div class="top-actions">
    <div class="runcount" id="runcount"><span class="dot"></span><span id="runcount-text">—</span></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" placeholder="Search…" autocomplete="off" />
    </div>
    <button id="refresh" class="btn btn-ghost" title="Refresh status">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button id="stop-all" class="btn btn-danger">Stop all</button>
  </div>
</div>

<main>
  <div id="groups"></div>
  <div id="empty" class="empty" style="display:none">No apps match your search.</div>
  <div class="hint">
    <span>Each app also has a <code>Launch.command</code> in its folder.</span>
    <span style="margin-left:auto">Press <span class="kbd">⌘K</span> to search</span>
  </div>
</main>

<script>
const groupsEl   = document.getElementById('groups');
const emptyEl     = document.getElementById('empty');
const refreshBtn  = document.getElementById('refresh');
const stopAllBtn  = document.getElementById('stop-all');
const searchEl    = document.getElementById('search');

let APPS = {};
let STATUS = {};
let ERRORS = {};
let query = '';
let pollTimer = null;

const GROUP_ORDER = ['Generators', 'Plotter', 'OS', 'Utilities'];

async function fetchApps() {
  APPS = await (await fetch('/api/apps')).json();
}

async function refresh() {
  try {
    const [s, e] = await Promise.all([
      fetch('/api/status').then(r => r.json()),
      fetch('/api/errors').then(r => r.json()).catch(() => ({})),
    ]);
    STATUS = s; ERRORS = e;
  } catch (_) {}
  render();
  scheduleNextPoll();
}

function scheduleNextPoll() {
  clearTimeout(pollTimer);
  // Poll faster while something is mid-launch so it flips to "running" promptly.
  const busy = Object.values(STATUS).some(s => s === 'starting');
  pollTimer = setTimeout(refresh, busy ? 1100 : 2500);
}

function statusOf(id) {
  const app = APPS[id] || {};
  if (app.kind === 'static') return 'ready';
  return STATUS[id] || 'stopped';
}

function render() {
  const byGroup = {};
  for (const [id, app] of Object.entries(APPS)) (byGroup[app.group] ||= []).push([id, app]);

  const orderedGroups = [
    ...GROUP_ORDER.filter(g => byGroup[g]),
    ...Object.keys(byGroup).filter(g => !GROUP_ORDER.includes(g)),
  ];

  const ids = Object.keys(APPS);
  const runningCount = ids.filter(id => statusOf(id) === 'running').length;
  const rc = document.getElementById('runcount');
  rc.classList.toggle('live', runningCount > 0);
  document.getElementById('runcount-text').innerHTML =
    `<b>${runningCount}</b> running · ${ids.length} apps`;

  groupsEl.innerHTML = '';
  let anyVisible = false;

  for (const group of orderedGroups) {
    const matches = byGroup[group].filter(([id, app]) => app.name.toLowerCase().includes(query));
    const section = document.createElement('section');
    section.className = 'group' + (matches.length ? '' : ' hidden');
    section.innerHTML = `
      <div class="group-head">
        <span class="group-title">${group}</span>
        <span class="group-count">${matches.length}</span>
        <span class="group-rule"></span>
      </div>
      <div class="list"></div>`;
    const list = section.querySelector('.list');
    matches.forEach(([id, app]) => { list.appendChild(renderRow(id, app)); anyVisible = true; });
    if (matches.length % 2 === 1) {
      const filler = document.createElement('div');
      filler.className = 'row filler';
      list.appendChild(filler);
    }
    groupsEl.appendChild(section);
  }
  emptyEl.style.display = anyVisible ? 'none' : 'block';
}

function renderRow(id, app) {
  const status = statusOf(id);
  const hasUrl = !!app.url;
  const isDesktop = app.kind === 'desktop';

  let dotCls = 'stop';
  if (status === 'running') dotCls = isDesktop ? 'desktop' : 'run';
  else if (status === 'starting') dotCls = 'starting';
  else if (status === 'error') dotCls = 'error';
  else if (status === 'ready') dotCls = 'ready';

  const meta = app.kind === 'static' ? 'static' : (app.port ? 'port ' + app.port : 'desktop');

  let actions = '';
  if (status === 'error') {
    actions = `<button class="mini retry" data-action="start" title="${(ERRORS[id]||'Failed to start').replace(/"/g,'&quot;')}">Retry</button>`;
  } else if (status === 'starting') {
    actions = `<button class="mini muted" disabled>Starting…</button>`;
  } else if (status === 'running') {
    if (hasUrl) actions += `<button class="mini primary" data-action="start">Open</button>`;
    actions += `<button class="mini stop" data-action="stop">Stop</button>`;
  } else {
    const label = (app.kind === 'static') ? 'Open' : 'Launch';
    actions = `<button class="mini" data-action="start">${label}</button>`;
  }

  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <span class="dot ${dotCls}"></span>
    <span class="rname${status === 'running' ? ' on' : ''}">${app.name}</span>
    <span class="rmeta ${app.port ? 'mono' : ''}">${meta}</span>
    <span class="ract">${actions}</span>`;

  const startBtn = row.querySelector('[data-action="start"]');
  if (startBtn) startBtn.addEventListener('click', () => startApp(id));
  const stopBtn = row.querySelector('[data-action="stop"]');
  if (stopBtn) stopBtn.addEventListener('click', () => stopApp(id));
  return row;
}

async function startApp(id) {
  // Optimistic: flip to "starting" immediately so the UI never feels frozen.
  if (APPS[id]?.kind !== 'static') { STATUS[id] = 'starting'; delete ERRORS[id]; render(); }
  try {
    const data = await (await fetch('/api/start?app=' + encodeURIComponent(id))).json();
    if (data.status === 'error') {
      STATUS[id] = 'error'; ERRORS[id] = data.message || 'Failed to start.';
    }
  } catch (e) {
    STATUS[id] = 'error'; ERRORS[id] = e.message;
  }
  refresh();
}

async function stopApp(id) {
  STATUS[id] = 'stopped'; render();
  try { await fetch('/api/stop?app=' + encodeURIComponent(id)); } finally { refresh(); }
}

stopAllBtn.addEventListener('click', async () => {
  const targets = Object.keys(STATUS).filter(id =>
    ['running', 'starting'].includes(STATUS[id]) && APPS[id]?.kind !== 'static');
  if (!targets.length) return;
  if (!confirm(`Stop ${targets.length} running app${targets.length > 1 ? 's' : ''}?`)) return;
  await Promise.all(targets.map(id => fetch('/api/stop?app=' + encodeURIComponent(id))));
  refresh();
});

refreshBtn.addEventListener('click', refresh);
searchEl.addEventListener('input', () => { query = searchEl.value.trim().toLowerCase(); render(); });
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchEl.focus(); searchEl.select(); }
});

(async () => { await fetchApps(); await refresh(); })();
</script>
</body>
</html>
