<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modular — Studio 1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="controls">
    <header>
      <h1>Modular</h1>
      <p class="sub">Stroke-only modular geometry · 0.4 mm pen · A-series</p>
    </header>

    <section>
      <h2>Mode</h2>
      <div id="mode-tabs" class="tabs"></div>
      <div id="mode-params" class="params"></div>
    </section>

    <section>
      <h2>Canvas</h2>
      <div class="field">
        <label for="size">Size</label>
        <select id="size"></select>
      </div>
      <div class="field">
        <label>Margin (mm) <output id="margin-val">16</output></label>
        <input type="range" id="margin" min="8" max="34" step="1" />
      </div>
      <div class="field">
        <label>Detail / scale <output id="detail-val">4.5</output></label>
        <input type="range" id="detail" min="2.5" max="9" step="0.1" />
      </div>
      <div class="field">
        <label>Stroke width (mm) <output id="stroke-val">0.4</output></label>
        <input type="range" id="stroke" min="0.2" max="0.8" step="0.05" />
      </div>
    </section>

    <section>
      <h2>Seed</h2>
      <div class="seedrow">
        <input type="number" id="seed" />
        <button id="randomize" title="Randomize">🎲</button>
      </div>
    </section>

    <section>
      <h2>Palette · 10 fixed pens</h2>
      <div id="swatches" class="swatches"></div>
      <p class="hint">Fixed Pilot 10-pen set. Click a pen to include / exclude it from the plot.</p>
    </section>

    <section>
      <h2>Pens used</h2>
      <div class="count" id="count"></div>
      <div id="legend" class="legend"></div>
      <p id="warn" class="warn">Heavy plot — many strokes. Increase Detail or lower density to thin it out.</p>
    </section>

    <div class="actions">
      <button id="regenerate" class="primary">Regenerate</button>
      <div class="exportrow">
        <input type="text" id="filename" value="modular" />
        <button id="export">Export SVG</button>
      </div>
    </div>
  </aside>

  <main>
    <div id="paper">
      <svg id="artboard" xmlns="http://www.w3.org/2000/svg"
           width="420mm" height="594mm" viewBox="0 0 420 594"
           preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </main>

  <script src="js/rng.js"></script>
  <script src="js/palettes.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
