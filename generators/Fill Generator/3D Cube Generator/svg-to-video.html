<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG to Video Converter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .file-input-wrapper {
      position: relative;
      margin-bottom: 30px;
    }
    
    .file-input-label {
      display: block;
      padding: 20px;
      border: 3px dashed #667eea;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #f8f9ff;
      position: relative;
      z-index: 1;
    }
    
    .file-input-label:hover {
      background: #f0f2ff;
      border-color: #764ba2;
    }
    
    .file-input-label.dragover {
      background: #e8ebff;
      border-color: #764ba2;
      transform: scale(1.02);
    }
    
    input[type="file"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: auto;
      margin: 0;
      padding: 0;
    }
    
    .file-count {
      margin-top: 10px;
      color: #667eea;
      font-weight: 600;
      font-size: 16px;
    }
    
    .settings {
      margin: 20px 0;
      padding: 20px;
      background: #f8f9ff;
      border-radius: 12px;
      position: relative;
      z-index: 10;
      pointer-events: auto;
    }
    
    .setting-group {
      margin-bottom: 15px;
      position: relative;
      z-index: 10;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
      position: relative;
      z-index: 10;
    }
    
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
      position: relative;
      z-index: 10;
      pointer-events: auto;
      background: white;
    }
    
    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .info {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    
    .convert-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }
    
    .convert-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    
    .convert-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .progress-container {
      margin-top: 20px;
      display: none;
    }
    
    .progress-container.active {
      display: block;
    }
    
    .progress-bar {
      width: 100%;
      height: 30px;
      background: #e0e0e0;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      width: 0%;
      transition: width 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 12px;
    }
    
    .progress-status {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 5px;
    }
    
    .error {
      margin-top: 20px;
      padding: 15px;
      background: #fee;
      border: 2px solid #fcc;
      border-radius: 8px;
      color: #c33;
      display: none;
    }
    
    .error.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 SVG to Video Converter</h1>
    <p class="subtitle">Convert your SVG frames into a high-quality MP4 video</p>
    
    <div class="file-input-wrapper">
      <label for="svgFiles" class="file-input-label" id="fileLabel">
        <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
        <div style="font-weight: 600; margin-bottom: 5px;">Click to select SVG files</div>
        <div style="font-size: 12px; color: #666;">or drag and drop files here</div>
        <input type="file" id="svgFiles" multiple accept=".svg" />
      </label>
      <div class="file-count" id="fileCount"></div>
    </div>
    
    <div class="settings">
      <div class="setting-group">
        <label for="duration">Video Duration (seconds)</label>
        <input type="number" id="duration" value="5" min="1" max="60" step="0.1" />
        <div class="info">FPS will be calculated automatically: <span id="fpsDisplay">--</span> fps</div>
      </div>
    </div>
    
    <button class="convert-btn" id="convertBtn" disabled>Convert to Video</button>
    
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill">0%</div>
      </div>
      <div class="progress-status" id="progressStatus">Initializing...</div>
    </div>
    
    <div class="error" id="errorMessage"></div>
  </div>
  
  <script type="module">
    import { convertSVGFilesToVideo } from './src/export/svgToVideoConverter.js';
    
    const fileInput = document.getElementById('svgFiles');
    const fileLabel = document.getElementById('fileLabel');
    const fileCount = document.getElementById('fileCount');
    const durationInput = document.getElementById('duration');
    const fpsDisplay = document.getElementById('fpsDisplay');
    const convertBtn = document.getElementById('convertBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const progressStatus = document.getElementById('progressStatus');
    const errorMessage = document.getElementById('errorMessage');
    
    let selectedFiles = [];
    
    // Update FPS display
    function updateFPS() {
      const duration = parseFloat(durationInput.value) || 5;
      const fps = selectedFiles.length / duration;
      fpsDisplay.textContent = fps.toFixed(2);
    }
    
    // Handle file selection
    fileInput.addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files).filter(file => 
        file.name.toLowerCase().endsWith('.svg')
      );
      
      if (selectedFiles.length > 0) {
        fileCount.textContent = `${selectedFiles.length} SVG file${selectedFiles.length !== 1 ? 's' : ''} selected`;
        convertBtn.disabled = false;
        updateFPS();
      } else {
        fileCount.textContent = '';
        convertBtn.disabled = true;
        fpsDisplay.textContent = '--';
      }
    });
    
    // Handle drag and drop
    fileLabel.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileLabel.classList.add('dragover');
    });
    
    fileLabel.addEventListener('dragleave', () => {
      fileLabel.classList.remove('dragover');
    });
    
    fileLabel.addEventListener('drop', (e) => {
      e.preventDefault();
      fileLabel.classList.remove('dragover');
      
      const files = Array.from(e.dataTransfer.files).filter(file => 
        file.name.toLowerCase().endsWith('.svg')
      );
      
      if (files.length > 0) {
        // Create a new FileList-like object
        const dataTransfer = new DataTransfer();
        files.forEach(file => dataTransfer.items.add(file));
        fileInput.files = dataTransfer.files;
        
        selectedFiles = files;
        fileCount.textContent = `${selectedFiles.length} SVG file${selectedFiles.length !== 1 ? 's' : ''} selected`;
        convertBtn.disabled = false;
        updateFPS();
      }
    });
    
    // Update FPS when duration changes
    durationInput.addEventListener('input', updateFPS);
    
    // Handle conversion
    convertBtn.addEventListener('click', async () => {
      if (selectedFiles.length === 0) {
        return;
      }
      
      // Hide error
      errorMessage.classList.remove('active');
      
      // Disable button and show progress
      convertBtn.disabled = true;
      progressContainer.classList.add('active');
      progressFill.style.width = '0%';
      progressFill.textContent = '0%';
      
      const duration = parseFloat(durationInput.value) || 5;
      
      try {
        await convertSVGFilesToVideo({
          files: selectedFiles,
          duration: duration,
          onProgress: (message, percent) => {
            if (percent !== undefined) {
              progressFill.style.width = `${Math.max(0, Math.min(100, percent))}%`;
              progressFill.textContent = `${Math.round(Math.max(0, Math.min(100, percent)))}%`;
            }
            if (message) {
              progressStatus.textContent = message;
            }
          },
          onComplete: () => {
            progressStatus.textContent = 'Video downloaded successfully!';
            setTimeout(() => {
              progressContainer.classList.remove('active');
              convertBtn.disabled = false;
            }, 2000);
          },
          onError: (error) => {
            errorMessage.textContent = `Error: ${error.message}`;
            errorMessage.classList.add('active');
            progressContainer.classList.remove('active');
            convertBtn.disabled = false;
          }
        });
      } catch (error) {
        errorMessage.textContent = `Error: ${error.message}`;
        errorMessage.classList.add('active');
        progressContainer.classList.remove('active');
        convertBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
