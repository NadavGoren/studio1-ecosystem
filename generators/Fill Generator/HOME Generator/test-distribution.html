<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distribution Test - HOME Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { margin-bottom: 10px; }
    .test-results {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      font-family: monospace;
    }
    .result-item {
      margin: 10px 0;
      padding: 10px;
      background: white;
      border-radius: 4px;
    }
    .success { color: #28a745; font-weight: bold; }
    .warning { color: #ffc107; font-weight: bold; }
    .error { color: #dc3545; font-weight: bold; }
    button {
      padding: 12px 24px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    button:hover {
      background: #0052a3;
    }
    .preview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    .preview svg {
      width: 100%;
      border: 1px solid #ddd;
    }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
    }
    .stats-table th,
    .stats-table td {
      padding: 8px;
      text-align: left;
      border: 1px solid #ddd;
    }
    .stats-table th {
      background: #0066cc;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Distribution Uniformity Test</h1>
  <p>This test generates multiple samples and analyzes the distribution of sky and ground fill strokes across the canvas to ensure they are evenly distributed without right-side bias.</p>
  
  <button id="run-test">Run Distribution Test</button>
  
  <div class="test-results" id="results" style="display: none;">
    <h2>Test Results</h2>
    <div id="results-content"></div>
  </div>
  
  <div class="preview" id="preview"></div>

  <script type="module">
    import { HouseGenerator } from '/src/generator/houseGenerator.ts';
    import { DEFAULT_CONFIG } from '/src/config/defaults.ts';
    import { generateHomeSvg } from '/src/export/svgExporter.ts';

    function analyzePathDistribution(pathGroups, canvasWidth, marginMm) {
      const results = {
        sky: { left: 0, center: 0, right: 0, total: 0 },
        ground: { left: 0, center: 0, right: 0, total: 0 }
      };

      const drawableStart = marginMm;
      const drawableEnd = canvasWidth - marginMm;
      const drawableWidth = drawableEnd - drawableStart;
      const leftBound = drawableStart + drawableWidth / 3;
      const rightBound = drawableStart + 2 * drawableWidth / 3;

      for (const group of pathGroups) {
        if (group.role === 'sky' || group.role === 'ground') {
          const target = results[group.role];
          
          for (const path of group.paths) {
            target.total++;
            
            // Extract first point from path (M x y ...)
            const match = path.match(/M\s+([\d.]+)\s+([\d.]+)/);
            if (match) {
              const x = parseFloat(match[1]);
              
              if (x < leftBound) {
                target.left++;
              } else if (x > rightBound) {
                target.right++;
              } else {
                target.center++;
              }
            }
          }
        }
      }

      return results;
    }

    function calculateUniformityScore(distribution) {
      if (distribution.total === 0) return 1.0;
      
      const expected = distribution.total / 3;
      const leftDiff = Math.abs(distribution.left - expected) / expected;
      const centerDiff = Math.abs(distribution.center - expected) / expected;
      const rightDiff = Math.abs(distribution.right - expected) / expected;
      
      const avgDiff = (leftDiff + centerDiff + rightDiff) / 3;
      return 1 - avgDiff;
    }

    function runTest() {
      const resultsDiv = document.getElementById('results');
      const resultsContent = document.getElementById('results-content');
      const previewDiv = document.getElementById('preview');
      
      resultsDiv.style.display = 'block';
      resultsContent.innerHTML = '<p>Running tests...</p>';
      previewDiv.innerHTML = '';

      const testSeeds = [12345, 54321, 99999, 11111, 77777];
      const allResults = [];

      for (const seed of testSeeds) {
        const config = {
          ...DEFAULT_CONFIG,
          randomSeed: seed
        };

        const generator = new HouseGenerator(config);
        const pathGroups = generator.generate();
        
        const distribution = analyzePathDistribution(
          pathGroups,
          config.canvas.widthMm,
          config.canvas.marginMm
        );

        const skyScore = calculateUniformityScore(distribution.sky);
        const groundScore = calculateUniformityScore(distribution.ground);

        allResults.push({
          seed,
          distribution,
          skyScore,
          groundScore,
          pathGroups,
          config
        });

        // Generate SVG for visual inspection
        const svg = generateHomeSvg(config, pathGroups);
        const wrapper = document.createElement('div');
        wrapper.appendChild(svg);
        previewDiv.appendChild(wrapper);
      }

      // Generate report
      let html = '<h3>Summary Statistics</h3>';
      
      const avgSkyScore = allResults.reduce((sum, r) => sum + r.skyScore, 0) / allResults.length;
      const avgGroundScore = allResults.reduce((sum, r) => sum + r.groundScore, 0) / allResults.length;

      const skyStatus = avgSkyScore >= 0.9 ? 'success' : avgSkyScore >= 0.8 ? 'warning' : 'error';
      const groundStatus = avgGroundScore >= 0.9 ? 'success' : avgGroundScore >= 0.8 ? 'warning' : 'error';

      html += `<div class="result-item">
        <strong>Average Sky Uniformity Score:</strong> 
        <span class="${skyStatus}">${(avgSkyScore * 100).toFixed(1)}%</span>
        <br>
        <strong>Average Ground Uniformity Score:</strong> 
        <span class="${groundStatus}">${(avgGroundScore * 100).toFixed(1)}%</span>
      </div>`;

      html += '<h3>Detailed Results by Seed</h3>';
      
      for (const result of allResults) {
        const skyStatus = result.skyScore >= 0.9 ? 'success' : result.skyScore >= 0.8 ? 'warning' : 'error';
        const groundStatus = result.groundScore >= 0.9 ? 'success' : result.groundScore >= 0.8 ? 'warning' : 'error';

        html += `<div class="result-item">
          <strong>Seed ${result.seed}:</strong>
          <table class="stats-table">
            <tr>
              <th>Type</th>
              <th>Left Third</th>
              <th>Center Third</th>
              <th>Right Third</th>
              <th>Total</th>
              <th>Uniformity Score</th>
            </tr>
            <tr>
              <td>Sky</td>
              <td>${result.distribution.sky.left}</td>
              <td>${result.distribution.sky.center}</td>
              <td>${result.distribution.sky.right}</td>
              <td>${result.distribution.sky.total}</td>
              <td class="${skyStatus}">${(result.skyScore * 100).toFixed(1)}%</td>
            </tr>
            <tr>
              <td>Ground</td>
              <td>${result.distribution.ground.left}</td>
              <td>${result.distribution.ground.center}</td>
              <td>${result.distribution.ground.right}</td>
              <td>${result.distribution.ground.total}</td>
              <td class="${groundStatus}">${(result.groundScore * 100).toFixed(1)}%</td>
            </tr>
          </table>
        </div>`;
      }

      html += '<h3>Interpretation</h3>';
      html += '<div class="result-item">';
      html += '<p><strong>Uniformity Score Guide:</strong></p>';
      html += '<ul>';
      html += '<li class="success">≥90%: Excellent - distribution is very uniform</li>';
      html += '<li class="warning">80-89%: Good - minor variations but acceptable</li>';
      html += '<li class="error">&lt;80%: Poor - significant bias detected</li>';
      html += '</ul>';
      html += '<p><strong>Expected Result:</strong> Each third should have approximately 33% of strokes (±10%).</p>';
      html += '</div>';

      resultsContent.innerHTML = html;
    }

    document.getElementById('run-test').addEventListener('click', runTest);
  </script>
</body>
</html>
